<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>牛馬薪水計 WorkHorse</title>
<meta name="description" content="即時顯示今天賺了多少錢(到小數點後兩位),並換算成咖啡、便當、手搖飲。">
<meta name="theme-color" content="#F8F4EE">
<meta name="build" content="__BUILD__">
<script src="js/boot.js?v=__BUILD__"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/workhorse/brand/app_icon_512.png">
<link rel="apple-touch-icon" href="assets/workhorse/brand/app_icon_512.png">
<link rel="stylesheet" href="style.css?v=__BUILD__">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <img class="logo" data-asset="brand.cow_coffee_logo" alt="" draggable="false">
      <div><b data-i18n="brand.name">牛馬薪水計</b><small data-i18n="brand.sub">WorkHorse</small></div>
    </div>
    <div class="tools">
      <button class="lang-btn" id="btnLang" type="button" data-i18n-aria="lang.title" data-i18n-title="lang.title">Language</button>
      <button class="icon-btn" id="btnShare" data-i18n-aria="btn.share" data-i18n-title="btn.share"><img class="ico" data-asset="ui_icons.share" alt=""></button>
      <button class="icon-btn" id="btnSettings" data-i18n-aria="btn.settings" data-i18n-title="btn.settings"><img class="ico" data-asset="ui_icons.settings_gear" alt=""></button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-view="home" class="active"><img class="ico sm" data-asset="ui_icons.home" alt=""><span data-i18n="tab.home">今日</span></button>
    <button data-view="rewards"><img class="ico sm" data-asset="ui_icons.wallet" alt=""><span data-i18n="tab.rewards">換算</span></button>
    <button data-view="history"><img class="ico sm" data-asset="ui_icons.time_history" alt=""><span data-i18n="tab.history">紀錄</span></button>
    <button data-view="stats"><img class="ico sm" data-asset="ui_icons.analytics_chart" alt=""><span data-i18n="tab.stats">統計</span></button>
  </nav>

  <main>
    <!-- 今日 -->
    <section class="view active" id="view-home">
      <div class="card hero">
        <div class="hero-top"><span class="chip" id="phaseChip">—</span></div>
        <div class="hero-label" data-i18n="hero.label">今天已經賺到</div>
        <div class="money amount"><span class="cur" data-bind="cur">NT$</span> <span data-bind="earned">0.00</span></div>
        <div class="rate" data-bind="rateLine"></div>
        <img class="mascot" id="mascot" alt="" draggable="false">
        <div class="goal">
          <div class="goal-row"><span><img class="ico xs" data-asset="ui_icons.goal_flag" alt=""><span data-i18n="goal.label">今日目標</span> <b class="amount" data-bind="goalAmt">—</b></span><b data-bind="goalPct">0%</b></div>
          <div class="bar"><i id="goalBar"></i></div>
        </div>
      </div>

      <div class="duo">
        <div class="card mini-info"><img class="ico" data-asset="ui_icons.clock" alt=""><div><small data-i18n="worked.label">已工作</small><b data-bind="worked">0:00:00</b><em data-bind="breakInfo"></em></div></div>
        <div class="card mini-info"><img class="ico" data-asset="ui_icons.calendar" alt=""><div><small data-bind="endLabel">—</small><b data-bind="toEnd">—</b><em data-bind="endInfo"></em></div></div>
      </div>

      <div class="quick">
        <button class="btn" id="btnOff"><img class="ico sm" data-asset="ui_icons.calendar" alt=""><span id="offLabel"></span></button>
        <button class="btn" id="btnOt"><img class="ico sm" data-asset="ui_icons.stopwatch" alt=""><span id="otLabel"></span></button>
        <button class="btn small" id="btnOtReset" hidden data-i18n="q.otReset">重設</button>
      </div>

      <div class="card next" id="nextReward">
        <button class="next-body" id="nextOpen" type="button"><span id="nextBody"></span></button>
        <div class="next-bar"><i id="nextBar"></i></div>
        <div class="next-foot"><button class="link-btn" id="btnPickNext" type="button" data-i18n="next.change">自訂</button></div>
      </div>
    </section>

    <!-- 換算 -->
    <section class="view" id="view-rewards">
      <div class="card">
        <div class="row between">
          <h2 data-i18n="items.title">這筆錢能買啥?</h2>
          <button class="btn small" id="btnAddItem" data-i18n="items.add">＋ 新增</button>
        </div>
        <label class="field inline"><span data-i18n="items.country">地區</span><select class="country-select" id="countrySelect"></select></label>
        <p class="note" data-i18n="items.note"></p>
      </div>
      <div id="itemList"></div>
    </section>

    <!-- 紀錄 -->
    <section class="view" id="view-history">
      <div class="card">
        <div class="row between">
          <h2 data-i18n="hist.title">班次紀錄</h2>
          <div class="row">
            <button class="btn small" id="btnAddShift" data-i18n="hist.add">＋ 補登</button>
            <button class="btn small" id="btnExportCsv"><img class="ico xs" data-asset="ui_icons.download" alt=""><span data-i18n="hist.csv">匯出 CSV</span></button>
          </div>
        </div>
      </div>
      <div id="historyList"></div>
    </section>

    <!-- 統計 -->
    <section class="view" id="view-stats">
      <div class="card">
        <div class="row between">
          <button class="icon-btn text" id="btnPrevMonth" data-i18n-aria="stats.prev">‹</button>
          <h2 id="monthTitle">—</h2>
          <button class="icon-btn text" id="btnNextMonth" data-i18n-aria="stats.next">›</button>
        </div>
      </div>
      <div id="statsBody"></div>
    </section>

    <!-- 設定 -->
    <section class="view" id="view-settings">
      <div class="card">
        <div class="row between"><h2 data-i18n="set.basic">基本設定</h2><button class="btn small done-btn" id="btnBackHome" data-i18n="set.done">完成</button></div>
        <label class="field"><span data-i18n="items.country">地區</span><select class="country-select" id="countrySelect2"></select></label>
        <label class="field"><span><span data-i18n="set.hourly">時薪</span> (<em data-bind="cur">NT$</em>)</span>
          <input type="number" min="0" step="0.01" inputmode="decimal" data-set="hourly"></label>
        <div class="field"><span data-i18n="set.days">一週上哪幾天班</span><div class="chips" id="dayChips"></div></div>
        <div class="grid2">
          <label class="field"><span data-i18n="set.start">上班時間</span><input type="time" data-set="start"></label>
          <label class="field"><span data-i18n="set.end">下班時間</span><input type="time" data-set="end"></label>
        </div>
        <p class="summary" id="timeNote"></p>
        <p class="note" data-i18n="set.holidayNote"></p>
      </div>

      <div class="card">
        <div class="row between"><h2 data-i18n="set.breaks">休息時間</h2><button class="btn small" id="btnAddBreak" data-i18n="set.addBreak">＋ 新增</button></div>
        <p class="note" data-i18n="set.breaksNote"></p>
        <div id="breakList"></div>
      </div>

      <details class="card adv">
        <summary data-i18n="set.adv">進階</summary>
        <label class="check"><input type="checkbox" data-set="ot.on"> <span data-i18n="set.otOn">啟用加班倍率</span></label>
        <div class="grid2">
          <label class="field"><span data-i18n="set.regular">正常工時</span><input type="number" min="0" step="0.5" data-set="regularHours"></label>
          <label class="field"><span data-i18n="set.h1">第一階加班</span><input type="number" min="0" step="0.5" data-set="ot.h1"></label>
          <label class="field"><span data-i18n="set.m1">第一階倍率</span><input type="number" min="1" step="0.01" data-set="ot.m1"></label>
          <label class="field"><span data-i18n="set.m2">之後倍率</span><input type="number" min="1" step="0.01" data-set="ot.m2"></label>
        </div>
        <p class="note" data-i18n="set.otNote"></p>
        <label class="field"><span data-i18n="set.goal">每日目標</span><input type="number" min="0" step="1" data-set="dailyGoal"></label>
        <label class="field"><span data-i18n="set.proxy">報價代理網址</span><input type="url" placeholder="https://" data-set="quoteProxy"></label>
        <p class="note" data-i18n="set.proxyNote"></p>
      </details>

      <div class="card">
        <h2 data-i18n="set.notify">提醒與顯示</h2>
        <label class="field"><span data-i18n="set.every">提示間隔</span>
          <select data-set="notifyEvery" id="notifySelect"></select></label>
        <label class="check"><input type="checkbox" data-set="useSystemNotification"> <span data-i18n="set.sysNotify">系統通知</span></label>
        <label class="check"><input type="checkbox" data-set="hideAmount"> <span data-i18n="set.hide">隱藏金額</span></label>
      </div>

      <div class="card">
        <h2 data-i18n="set.data">資料</h2>
        <p class="note" data-i18n="set.dataNote"></p>
        <div class="row wrap">
          <button class="btn small" id="btnBackup"><img class="ico xs" data-asset="ui_icons.download" alt=""><span data-i18n="set.backup">匯出備份</span></button>
          <button class="btn small" id="btnRestore" data-i18n="set.restore">匯入備份</button>
          <button class="btn small danger" id="btnReset" data-i18n="set.reset">還原預設值</button>
        </div>
        <input type="file" id="fileRestore" accept="application/json" hidden>
      </div>
      <div class="done-bar"><button class="btn done-btn" id="btnDoneBottom" type="button" data-i18n="set.done">完成</button></div>
    </section>
  </main>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<!-- 載入失敗時顯示(由 js/boot.js 控制) -->
<div id="bootError" class="boot-error" role="alert" hidden>
  <b>網頁載入出了問題 / Something went wrong / エラーが発生しました</b>
  <code id="bootErrorMsg"></code>
  <div class="row wrap">
    <button class="btn small" onclick="location.reload()">重新載入 Reload</button>
    <button class="btn small primary" onclick="WH_RESET()">清除快取並重新載入 Clear cache</button>
  </div>
</div>

<!-- 換算項目編輯 -->
<dialog id="itemDialog">
  <form method="dialog" id="itemForm">
    <h3 id="itemDialogTitle"></h3>
    <div class="row top">
      <span class="icon-preview"><img id="itemIconPreview" alt=""></span>
      <label class="field grow"><span data-i18n="dlg.icon">圖示</span><select name="icon"></select></label>
    </div>
    <label class="field"><span data-i18n="dlg.category">類別</span><select name="category"></select></label>
    <label class="field"><span data-i18n="dlg.name">名稱</span><input name="name" required maxlength="30"></label>
    <label class="field"><span data-i18n="dlg.price">價格</span><input name="price" type="number" min="0.01" step="0.01" required></label>
    <label class="field"><span data-i18n="dlg.kind">類型</span>
      <select name="kind">
        <option value="consumable" data-i18n="dlg.kind.consumable"></option>
        <option value="goal" data-i18n="dlg.kind.goal"></option>
      </select></label>
    <label class="field" id="savedField"><span data-i18n="dlg.saved">已存金額</span><input name="saved" type="number" min="0" step="1"></label>
    <label class="check" id="doneField"><input type="checkbox" name="done"> <span data-i18n="goal.markDone">標記為已達成</span></label>
    <div class="field"><span data-i18n="dlg.image">圖片(選填)</span>
      <div class="row">
        <button type="button" class="btn small" id="btnPickImage" data-i18n="dlg.pickImage">上傳圖片</button>
        <button type="button" class="btn small" id="btnClearImage" data-i18n="dlg.imageClear">移除圖片</button>
        <input type="file" id="fileImage" accept="image/*" hidden>
      </div>
    </div>
    <div class="row end">
      <button type="button" class="btn danger" id="btnDeleteItem" data-i18n="dlg.delete">刪除</button>
      <span class="grow"></span>
      <button type="button" class="btn" id="btnCancelItem" data-i18n="dlg.cancel">取消</button>
      <button type="submit" class="btn primary" data-i18n="dlg.save">儲存</button>
    </div>
  </form>
</dialog>

<!-- 股票 -->
<dialog id="stockDialog">
  <form method="dialog" id="stockForm">
    <h3 id="stockDialogTitle" data-i18n="stock.title">新增股票</h3>
    <div class="grid2">
      <label class="field"><span data-i18n="stock.market">市場</span><select name="market" id="stockMarket"></select></label>
      <span></span>
    </div>
    <label class="field"><span data-i18n="stock.query">股票代碼或簡稱</span>
      <span class="row"><input name="q" id="stockQuery" autocomplete="off" data-i18n-ph="stock.ph"><button type="button" class="btn small" id="btnStockSearch" data-i18n="stock.search">搜尋</button></span></label>
    <div id="stockResults" class="results"></div>
    <p class="note" id="stockStatus" data-i18n="stock.noPick"></p>
    <label class="field"><span id="stockManualLabel"></span><input name="manual" type="number" min="0" step="any"></label>
    <p class="note" data-i18n="stock.note"></p>
    <div class="row end">
      <button type="button" class="btn danger" id="btnDeleteStock" data-i18n="dlg.delete">刪除</button>
      <span class="grow"></span>
      <button type="button" class="btn" id="btnCancelStock" data-i18n="dlg.cancel">取消</button>
      <button type="submit" class="btn primary" id="btnSubmitStock" data-i18n="stock.add">加入</button>
    </div>
  </form>
</dialog>

<!-- 首頁「下一個目標」自訂 -->
<dialog id="nextDialog">
  <h3 data-i18n="next.pick">選擇首頁要追蹤的目標</h3>
  <div id="nextOptions" class="pick-list" role="radiogroup"></div>
  <div class="row end"><span class="grow"></span><button type="button" class="btn" id="btnCloseNext" data-i18n="share.close">關閉</button></div>
</dialog>

<!-- 第一次進來:還在用預設的上班設定 -->
<dialog id="setupDialog">
  <h3 data-i18n="setup.title">先設定你的上班時間吧</h3>
  <p id="setupBody" class="setup-body"></p>
  <div class="row end">
    <button type="button" class="btn" id="btnSetupLater" data-i18n="setup.later">先用預設,稍後再說</button>
    <span class="grow"></span>
    <button type="button" class="btn done-btn" id="btnSetupGo" data-i18n="setup.go" autofocus>去設定</button>
  </div>
</dialog>

<!-- 補登班次 -->
<dialog id="shiftDialog">
  <form method="dialog" id="shiftForm">
    <h3 data-i18n="dlg.shift.title">補登班次</h3>
    <label class="field"><span data-i18n="dlg.shift.start">上班時間</span><input type="datetime-local" name="start" required></label>
    <label class="field"><span data-i18n="dlg.shift.end">下班時間</span><input type="datetime-local" name="end" required></label>
    <label class="field"><span data-i18n="dlg.shift.break">休息(分鐘)</span><input type="number" name="breakMin" min="0" step="5" value="60"></label>
    <p class="note" id="shiftPreview"></p>
    <div class="row end">
      <span class="grow"></span>
      <button type="button" class="btn" id="btnCancelShift" data-i18n="dlg.cancel">取消</button>
      <button type="submit" class="btn primary" data-i18n="dlg.shift.add">加入紀錄</button>
    </div>
  </form>
</dialog>

<!-- 成果卡 -->
<dialog id="shareDialog">
  <h3 data-i18n="share.dialog">薪水成果卡</h3>
  <canvas id="shareCanvas" width="1080" height="1080"></canvas>
  <label class="check"><input type="checkbox" id="shareShowAmount" checked> <span data-i18n="share.show">顯示累積金額</span></label>
  <p class="note" data-i18n="share.note"></p>
  <div class="row end">
    <button class="btn" id="btnShareClose" data-i18n="share.close">關閉</button>
    <button class="btn" id="btnShareCopy" data-i18n="share.copy">複製圖片</button>
    <button class="btn primary" id="btnShareSave" data-i18n="share.save">下載 PNG</button>
  </div>
</dialog>

<script src="assets/workhorse/asset-manifest.js?v=__BUILD__"></script>
<script src="js/i18n.js?v=__BUILD__"></script>
<script src="js/prices.js?v=__BUILD__"></script>
<script src="js/defaults.js?v=__BUILD__"></script>
<script src="js/assets.js?v=__BUILD__"></script>
<script src="js/core.js?v=__BUILD__"></script>
<script src="js/stocks.js?v=__BUILD__"></script>
<script src="js/share.js?v=__BUILD__"></script>
<script src="js/app.js?v=__BUILD__"></script>
</body>
</html>
